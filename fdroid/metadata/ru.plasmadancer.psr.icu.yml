Name: ПСР Видео
Summary: USB / экран / камера на MediaMTX ПСР
Description: |
  Дополнительное приложение для трансляции USB-камеры, экрана телефона
  или камеры на сервер ПСР (MediaMTX + CoT).
  Обычный эфир с поля делается в ПСР TAK (Инструменты → Трансляция).
  Хост в APK не зашит — адрес приходит из ссылки штаба.

RepoType: git
