Name: ПСР TAK
Summary: Единый полевой TAK-клиент ПСР
Description: |
  Отдельное приложение ПСР: карта, CoT, метки, фото/голос, задания миссии,
  чат и режимы роли (поисковик / старший / полевой штаб).
  Простота лёгкого клиента + нужный функционал ПСР; сервер fts.plasmadancer.ru из коробки.
  Видеострим — отдельное приложение «ПСР Видео» (открывается из настроек).
  База: OmniTAK-Android. Upstream: https://github.com/engindearing-projects/OmniTAK-Android

