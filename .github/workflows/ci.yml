name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pss-tak:
    name: APK · PSS TAK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/pss-tak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/pss-tak/**/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Stable upload keystore (same cert as fts downloads)
        env:
          PSR_UPLOAD_KEYSTORE_B64: ${{ secrets.PSR_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${PSR_UPLOAD_KEYSTORE_B64:-}" || { echo "missing PSR_UPLOAD_KEYSTORE_B64 secret"; exit 1; }
          bash ../../scripts/psr-upload-keystore.sh
          echo "PSR_UPLOAD_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug (psr)
        run: |
          chmod +x gradlew
          ./gradlew assemblePsrDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pss-tak
          path: apps/pss-tak/app/build/outputs/apk/psr/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-opentak-icu:
    name: APK · OpenTAK ICU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/opentak-icu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/opentak-icu/**/build.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Stable upload keystore (same cert as fts downloads)
        env:
          PSR_UPLOAD_KEYSTORE_B64: ${{ secrets.PSR_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${PSR_UPLOAD_KEYSTORE_B64:-}" || { echo "missing PSR_UPLOAD_KEYSTORE_B64 secret"; exit 1; }
          bash ../../scripts/psr-upload-keystore.sh
          echo "PSR_UPLOAD_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug (psr)
        run: |
          chmod +x gradlew
          ./gradlew assemblePsrDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-opentak-icu
          path: apps/opentak-icu/app/build/outputs/apk/psr/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Свой F-Droid репозиторий → GitHub Pages (только main)
  publish-fdroid:
    name: F-Droid repo → Pages
    needs: [build-pss-tak, build-opentak-icu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
      - name: Install fdroidserver + apksigner deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner aapt libmagic1
          pip install "fdroidserver==2.4.4" "androguard==4.1.4"
          # fdroidserver 2.4.4 forces apkobject._v2_blocks = NoOverwriteDict() as a
          # workaround for old androguard; androguard 4.1+ uses a list and .append().
          python3 - <<'PY'
          from pathlib import Path
          import fdroidserver.common as common
          path = Path(common.__file__)
          text = path.read_text()
          old = "    apkobject._v2_blocks = NoOverwriteDict()\n"
          if old not in text:
              raise SystemExit(f"fdroidserver patch target missing in {path}")
          path.write_text(
              text.replace(
                  old,
                  "    # patched: androguard>=4.1 uses list for _v2_blocks\n",
                  1,
              )
          )
          print(f"patched {path}")
          PY
          # aapt from SDK is more reliable for AGP 8+ APKs than androguard alone
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "build-tools;35.0.0"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/apks

      - name: Prepare fdroid workspace
        env:
          FDROID_REPO_KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
          FDROID_REPO_KEY_PASS: ${{ secrets.FDROID_REPO_KEY_PASS }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${FDROID_REPO_KEYSTORE_B64:-}" || { echo "missing FDROID_REPO_KEYSTORE_B64 secret"; exit 1; }
          mkdir -p fdroid/repo/icons
          test -f fdroid/repo/icons/icon.png
          echo "$FDROID_REPO_KEYSTORE_B64" | base64 -d > fdroid/keystore.jks
          # Non-APK files in repo/ (e.g. .gitkeep) are indexed as fake packages;
          # F-Droid then aborts refresh because the package name is invalid.
          rm -f fdroid/repo/.gitkeep
          find fdroid/repo -maxdepth 1 -type f ! -name '*.apk' -delete || true
          find /tmp/apks -name '*.apk' -print
          cp "$(find /tmp/apks/apk-pss-tak -path '*/psr/debug/*.apk' | head -1)" \
            "fdroid/repo/pss-tak-psr-$(git rev-parse --short HEAD).apk"
          cp "$(find /tmp/apks/apk-opentak-icu -path '*/psr/debug/*.apk' | head -1)" \
            "fdroid/repo/opentak-icu-psr-$(git rev-parse --short HEAD).apk"
          cat > fdroid/config.yml <<EOF
          repo_url: https://reinethernal.github.io/pss-tak/fdroid/repo
          repo_name: ПСР
          repo_description: Полевой репозиторий ПСР (ПСР TAK + ПСР Видео) для fts.plasmadancer.ru
          archive_older: 0
          make_current_version_link: false
          keystore: keystore.jks
          repo_keyalias: ${FDROID_REPO_KEY_ALIAS}
          keystorepass: ${FDROID_REPO_KEYSTORE_PASS}
          keypass: ${FDROID_REPO_KEY_PASS}
          EOF
          # YAML indent from heredoc — rewrite cleanly without leading spaces
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or ''
          aapts = sorted(glob.glob(str(Path(sdk) / 'build-tools' / '*' / 'aapt'))) if sdk else []
          aapt35 = str(Path(sdk) / 'build-tools' / '35.0.0' / 'aapt') if sdk else ''
          aapt = aapt35 if aapt35 and Path(aapt35).is_file() else (aapts[-1] if aapts else '')
          print('sdk_path', sdk, 'aapt', aapt)
          Path('fdroid/icon.png').write_bytes(Path('fdroid/repo/icons/icon.png').read_bytes())
          Path('fdroid/config.yml').write_text(
              "repo_url: https://reinethernal.github.io/pss-tak/fdroid/repo\n"
              "repo_name: ПСР\n"
              "repo_description: Полевой репозиторий ПСР (ПСР TAK + ПСР Видео) для fts.plasmadancer.ru\n"
              "archive_older: 0\n"
              "make_current_version_link: false\n"
              "repo_icon: icon.png\n"
              f"sdk_path: {sdk}\n"
              + (f"aapt: {aapt}\n" if aapt else "")
              + "keystore: keystore.jks\n"
              f"repo_keyalias: {os.environ['FDROID_REPO_KEY_ALIAS']}\n"
              f"keystorepass: {os.environ['FDROID_REPO_KEYSTORE_PASS']}\n"
              f"keypass: {os.environ['FDROID_REPO_KEY_PASS']}\n"
          )
          Path('fdroid/config.yml').chmod(0o600)
          PY

      - name: fdroid update
        working-directory: fdroid
        run: |
          set -euo pipefail
          fdroid update --pretty --delete-unknown
          test -f repo/index-v1.jar
          test -f repo/index-v1.json
          test -f repo/index-v2.json
          test -f repo/entry.jar
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "ru.plasmadancer.psr.icu",
              "ru.plasmadancer.psr.tak",
          }
          idx = json.loads(Path("repo/index-v1.json").read_text())
          pkgs = set(idx["packages"])
          if pkgs != expected:
              raise SystemExit(f"unexpected F-Droid packages: {sorted(pkgs)}")
          for pkg, vers in idx["packages"].items():
              if not vers:
                  raise SystemExit(f"no APK for {pkg}")
              for v in vers:
                  name = v.get("apkName") or ""
                  if not name.endswith(".apk"):
                      raise SystemExit(f"non-APK indexed for {pkg}: {name!r}")
                  if not v.get("signer"):
                      raise SystemExit(f"missing signer for {pkg}")
                  if int(v.get("versionCode") or 0) <= 0:
                      raise SystemExit(f"bad versionCode for {pkg}: {v.get('versionCode')}")
          apps = {a["packageName"]: a for a in idx["apps"]}
          for pkg in sorted(expected):
              icon = (apps.get(pkg) or {}).get("icon")
              print(f"icon {pkg}: {icon or '(none)'}")
          extracted = sorted(p.name for p in Path("repo").glob("icons-*/*.png"))
          print("extracted icons:", extracted)
          print("fdroid index OK:", ", ".join(sorted(pkgs)))
          PY
          ls -lh repo/*.apk repo/index-v1.jar repo/entry.jar

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -a fdroid/repo _site/fdroid/repo
          cp fdroid/site/index.html _site/index.html
          cp fdroid/site/repo-qr.png _site/repo-qr.png
          # also expose README
          cp fdroid/README.md _site/fdroid/README.md || true
          # GitHub Pages must not run Jekyll (it would skip .jar / ignore some binaries).
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
