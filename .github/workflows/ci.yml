name: CI

# Official APKs are produced only here. Do not assemble/publish from the HQ host.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pss-tak:
    name: APK · PSS TAK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/pss-tak
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Minor bump if TAK sources changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash ../../scripts/ci-bump-if-apps-changed.sh pss-tak
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/pss-tak/**/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Stable upload keystore (same cert as fts downloads)
        env:
          PSR_UPLOAD_KEYSTORE_B64: ${{ secrets.PSR_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${PSR_UPLOAD_KEYSTORE_B64:-}" || { echo "missing PSR_UPLOAD_KEYSTORE_B64 secret"; exit 1; }
          bash ../../scripts/psr-upload-keystore.sh
          echo "PSR_UPLOAD_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug (psr)
        run: |
          chmod +x gradlew
          ./gradlew assemblePsrDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pss-tak
          path: apps/pss-tak/app/build/outputs/apk/psr/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-opentak-icu:
    name: APK · OpenTAK ICU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/opentak-icu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Minor bump if ICU sources changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash ../../scripts/ci-bump-if-apps-changed.sh opentak-icu
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/opentak-icu/**/build.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Stable upload keystore (same cert as fts downloads)
        env:
          PSR_UPLOAD_KEYSTORE_B64: ${{ secrets.PSR_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${PSR_UPLOAD_KEYSTORE_B64:-}" || { echo "missing PSR_UPLOAD_KEYSTORE_B64 secret"; exit 1; }
          bash ../../scripts/psr-upload-keystore.sh
          echo "PSR_UPLOAD_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug (psr)
        run: |
          chmod +x gradlew
          ./gradlew assemblePsrDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-opentak-icu
          path: apps/opentak-icu/app/build/outputs/apk/psr/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  commit-versions:
    name: Commit version bumps
    needs: [build-pss-tak, build-opentak-icu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-apply bumps and push if gradle changed
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          bash scripts/ci-bump-if-apps-changed.sh pss-tak
          bash scripts/ci-bump-if-apps-changed.sh opentak-icu
          git add apps/pss-tak/app/build.gradle.kts apps/opentak-icu/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "no version files to commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): bump app versions after CI build"
          git push origin HEAD:main

  # Свой F-Droid репозиторий → GitHub Pages (только main)
  # Avoid setup-java / setup-android / download-artifact actions: codeload.github.com
  # rate-limits (429/503) have been failing this job after APKs already built.
  publish-fdroid:
    name: F-Droid repo → Pages
    needs: [build-pss-tak, build-opentak-icu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Java, Python, Android SDK, fdroidserver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless python3 python3-pip python3-venv \
            unzip wget curl apksigner aapt libmagic1 git
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/tmp/sdk-licenses.txt || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/pip install -q "fdroidserver==2.4.4" "androguard==4.1.4"
          echo "/tmp/fdroid-venv/bin" >> "$GITHUB_PATH"
          # fdroidserver 2.4.4 forces apkobject._v2_blocks = NoOverwriteDict() as a
          # workaround for old androguard; androguard 4.1+ uses a list and .append().
          /tmp/fdroid-venv/bin/python3 - <<'PY'
          from pathlib import Path
          import fdroidserver.common as common
          path = Path(common.__file__)
          text = path.read_text()
          old = "    apkobject._v2_blocks = NoOverwriteDict()\n"
          if old not in text:
              raise SystemExit(f"fdroidserver patch target missing in {path}")
          path.write_text(
              text.replace(
                  old,
                  "    # patched: androguard>=4.1 uses list for _v2_blocks\n",
                  1,
              )
          )
          print(f"patched {path}")
          PY

      - name: Download APK artifacts (API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          curl --retry 15 --retry-delay 8 --retry-all-errors -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            > /tmp/artifacts.json
          python3 - <<'PY'
          import json, os, subprocess, zipfile
          from pathlib import Path
          data = json.loads(Path("/tmp/artifacts.json").read_text())
          wanted = {"apk-pss-tak", "apk-opentak-icu"}
          token = os.environ["GH_TOKEN"]
          found = {}
          for a in data.get("artifacts") or []:
              if a["name"] in wanted and not a.get("expired"):
                  found[a["name"]] = a["id"]
          if set(found) != wanted:
              raise SystemExit(f"missing artifacts: have={sorted(found)} need={sorted(wanted)}")
          for name, aid in found.items():
              zpath = Path(f"/tmp/{name}.zip")
              dest = Path("/tmp/apks") / name
              dest.mkdir(parents=True, exist_ok=True)
              subprocess.check_call([
                  "curl", "--retry", "15", "--retry-delay", "8", "--retry-all-errors",
                  "-fsSL", "-H", f"Authorization: Bearer {token}",
                  "-H", "Accept: application/vnd.github+json",
                  "-o", str(zpath),
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{aid}/zip",
              ])
              with zipfile.ZipFile(zpath) as zf:
                  zf.extractall(dest)
              print(name, "->", list(dest.rglob("*.apk")))
          PY

      - name: Prepare fdroid workspace
        env:
          FDROID_REPO_KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
          FDROID_REPO_KEY_PASS: ${{ secrets.FDROID_REPO_KEY_PASS }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${FDROID_REPO_KEYSTORE_B64:-}" || { echo "missing FDROID_REPO_KEYSTORE_B64 secret"; exit 1; }
          mkdir -p fdroid/repo/icons
          test -f fdroid/repo/icons/icon.png
          echo "$FDROID_REPO_KEYSTORE_B64" | base64 -d > fdroid/keystore.jks
          # Non-APK files in repo/ (e.g. .gitkeep) are indexed as fake packages;
          # F-Droid then aborts refresh because the package name is invalid.
          rm -f fdroid/repo/.gitkeep
          find fdroid/repo -maxdepth 1 -type f ! -name '*.apk' -delete || true
          find /tmp/apks -name '*.apk' -print
          tak_apk="$(find /tmp/apks/apk-pss-tak -name '*.apk' -type f | head -1)"
          icu_apk="$(find /tmp/apks/apk-opentak-icu -name '*.apk' -type f | head -1)"
          test -n "$tak_apk" || { echo "missing TAK APK artifact"; exit 1; }
          test -n "$icu_apk" || { echo "missing ICU APK artifact"; exit 1; }
          cp "$tak_apk" "fdroid/repo/pss-tak-psr-$(git rev-parse --short HEAD).apk"
          cp "$icu_apk" "fdroid/repo/opentak-icu-psr-$(git rev-parse --short HEAD).apk"
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or ''
          aapts = sorted(glob.glob(str(Path(sdk) / 'build-tools' / '*' / 'aapt'))) if sdk else []
          aapt35 = str(Path(sdk) / 'build-tools' / '35.0.0' / 'aapt') if sdk else ''
          aapt = aapt35 if aapt35 and Path(aapt35).is_file() else (aapts[-1] if aapts else '')
          print('sdk_path', sdk, 'aapt', aapt)
          Path('fdroid/icon.png').write_bytes(Path('fdroid/repo/icons/icon.png').read_bytes())
          Path('fdroid/config.yml').write_text(
              "repo_url: https://reinethernal.github.io/pss-tak/fdroid/repo\n"
              "repo_name: ПСР\n"
              "repo_description: Полевой репозиторий ПСР (ПСР TAK + ПСР Видео) для fts.plasmadancer.ru\n"
              "archive_older: 0\n"
              "make_current_version_link: false\n"
              "repo_icon: icon.png\n"
              f"sdk_path: {sdk}\n"
              + (f"aapt: {aapt}\n" if aapt else "")
              + "keystore: keystore.jks\n"
              f"repo_keyalias: {os.environ['FDROID_REPO_KEY_ALIAS']}\n"
              f"keystorepass: {os.environ['FDROID_REPO_KEYSTORE_PASS']}\n"
              f"keypass: {os.environ['FDROID_REPO_KEY_PASS']}\n"
          )
          Path('fdroid/config.yml').chmod(0o600)
          PY

      - name: fdroid update
        working-directory: fdroid
        run: |
          set -euo pipefail
          fdroid update --pretty --delete-unknown
          test -f repo/index-v1.jar
          test -f repo/index-v1.json
          test -f repo/index-v2.json
          test -f repo/entry.jar
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "ru.plasmadancer.psr.icu",
              "ru.plasmadancer.psr.tak",
          }
          idx = json.loads(Path("repo/index-v1.json").read_text())
          pkgs = set(idx["packages"])
          if pkgs != expected:
              raise SystemExit(f"unexpected F-Droid packages: {sorted(pkgs)}")
          for pkg, vers in idx["packages"].items():
              if not vers:
                  raise SystemExit(f"no APK for {pkg}")
              for v in vers:
                  name = v.get("apkName") or ""
                  if not name.endswith(".apk"):
                      raise SystemExit(f"non-APK indexed for {pkg}: {name!r}")
                  if not v.get("signer"):
                      raise SystemExit(f"missing signer for {pkg}")
                  if int(v.get("versionCode") or 0) <= 0:
                      raise SystemExit(f"bad versionCode for {pkg}: {v.get('versionCode')}")
          apps = {a["packageName"]: a for a in idx["apps"]}
          for pkg in sorted(expected):
              icon = (apps.get(pkg) or {}).get("icon")
              print(f"icon {pkg}: {icon or '(none)'}")
          extracted = sorted(p.name for p in Path("repo").glob("icons-*/*.png"))
          print("extracted icons:", extracted)
          print("fdroid index OK:", ", ".join(sorted(pkgs)))
          PY
          ls -lh repo/*.apk repo/index-v1.jar repo/entry.jar

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -a fdroid/repo _site/fdroid/repo
          cp fdroid/site/index.html _site/index.html
          cp fdroid/site/repo-qr.png _site/repo-qr.png
          cp fdroid/README.md _site/fdroid/README.md || true
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init
          git checkout --orphan gh-pages
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "F-Droid repo ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
