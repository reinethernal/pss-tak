name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pss-tak:
    name: APK · PSS TAK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/pss-tak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/pss-tak/**/build.gradle.kts
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-pss-tak
          path: apps/pss-tak/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  build-opentak-icu:
    name: APK · OpenTAK ICU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/opentak-icu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/opentak-icu/**/build.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Inject ПСР truststore into assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fsSL --max-time 30 \
            "https://fts.plasmadancer.ru/downloads/truststore-root.p12" \
            -o app/src/main/assets/truststore-root.p12
          test -s app/src/main/assets/truststore-root.p12
      - uses: gradle/actions/setup-gradle@v4
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-opentak-icu
          path: apps/opentak-icu/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Свой F-Droid репозиторий → GitHub Pages (только main)
  publish-fdroid:
    name: F-Droid repo → Pages
    needs: [build-pss-tak, build-opentak-icu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3
      - name: Install fdroidserver + apksigner deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner aapt libmagic1
          pip install "fdroidserver==2.4.4" "androguard==4.1.4"
          # fdroidserver 2.4.4 forces apkobject._v2_blocks = NoOverwriteDict() as a
          # workaround for old androguard; androguard 4.1+ uses a list and .append().
          python3 - <<'PY'
          from pathlib import Path
          import fdroidserver.common as common
          path = Path(common.__file__)
          text = path.read_text()
          old = "    apkobject._v2_blocks = NoOverwriteDict()\n"
          if old not in text:
              raise SystemExit(f"fdroidserver patch target missing in {path}")
          path.write_text(
              text.replace(
                  old,
                  "    # patched: androguard>=4.1 uses list for _v2_blocks\n",
                  1,
              )
          )
          print(f"patched {path}")
          PY
          # aapt from SDK is more reliable for AGP 8+ APKs than androguard alone
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "build-tools;35.0.0"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/apks

      - name: Prepare fdroid workspace
        env:
          FDROID_REPO_KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_B64 }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
          FDROID_REPO_KEY_PASS: ${{ secrets.FDROID_REPO_KEY_PASS }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${FDROID_REPO_KEYSTORE_B64:-}" || { echo "missing FDROID_REPO_KEYSTORE_B64 secret"; exit 1; }
          mkdir -p fdroid/repo/icons
          test -f fdroid/repo/icons/icon.png
          echo "$FDROID_REPO_KEYSTORE_B64" | base64 -d > fdroid/keystore.jks
          # Copy latest APKs (rename clearly)
          find /tmp/apks -name '*.apk' -print
          cp "$(find /tmp/apks/apk-pss-tak -name '*.apk' | head -1)" \
            "fdroid/repo/pss-tak-$(git rev-parse --short HEAD).apk"
          cp "$(find /tmp/apks/apk-opentak-icu -name '*.apk' | head -1)" \
            "fdroid/repo/opentak-icu-$(git rev-parse --short HEAD).apk"
          cat > fdroid/config.yml <<EOF
          repo_url: https://reinethernal.github.io/pss-tak/fdroid/repo
          repo_name: ПСР
          repo_description: Полевой репозиторий ПСР (ПСР TAK + ПСР Видео) для fts.plasmadancer.ru
          archive_older: 0
          make_current_version_link: false
          keystore: keystore.jks
          repo_keyalias: ${FDROID_REPO_KEY_ALIAS}
          keystorepass: ${FDROID_REPO_KEYSTORE_PASS}
          keypass: ${FDROID_REPO_KEY_PASS}
          EOF
          # YAML indent from heredoc — rewrite cleanly without leading spaces
          python3 - <<'PY'
          from pathlib import Path
          import os
          sdk = os.environ.get('ANDROID_HOME') or os.environ.get('ANDROID_SDK_ROOT') or ''
          Path('fdroid/config.yml').write_text(f"""repo_url: https://reinethernal.github.io/pss-tak/fdroid/repo
          repo_name: ПСР
          repo_description: Полевой репозиторий ПСР (ПСР TAK + ПСР Видео) для fts.plasmadancer.ru
          archive_older: 0
          make_current_version_link: false
          repo_icon: icon.png
          sdk_path: {sdk}
          keystore: keystore.jks
          repo_keyalias: {os.environ['FDROID_REPO_KEY_ALIAS']}
          keystorepass: {os.environ['FDROID_REPO_KEYSTORE_PASS']}
          keypass: {os.environ['FDROID_REPO_KEY_PASS']}
          """.replace('          ', ''))
          Path('fdroid/config.yml').chmod(0o600)
          PY

      - name: fdroid update
        working-directory: fdroid
        run: |
          set -euo pipefail
          fdroid update --create-metadata --pretty --delete-unknown
          test -f repo/index-v1.json -o -f repo/index.xml
          ls -lh repo/

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -a fdroid/repo _site/fdroid/repo
          cp fdroid/site/index.html _site/index.html
          cp fdroid/site/repo-qr.png _site/repo-qr.png
          # also expose README
          cp fdroid/README.md _site/fdroid/README.md || true

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          force_orphan: true
