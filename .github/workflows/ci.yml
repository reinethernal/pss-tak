name: CI

# Сборка всех изменённых приложений на каждый push
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pss-tak:
    name: APK · PSS TAK (OmniTAK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/pss-tak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/pss-tak/**/build.gradle.kts

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pss-tak-${{ github.run_number }}-${{ github.sha }}
          path: apps/pss-tak/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  build-opentak-icu:
    name: APK · OpenTAK ICU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/opentak-icu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/opentak-icu/**/build.gradle*

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          # ICU historically uses older build-tools; install both
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opentak-icu-${{ github.run_number }}-${{ github.sha }}
          path: apps/opentak-icu/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
