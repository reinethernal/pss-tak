<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Приглашение в ПСС</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=pss1" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=pss1" />

  <style>
    :root { --bg:#0f1419; --card:#1a2332; --fg:#e8eef7; --muted:#9aa8bc; --acc:#3d9cf0; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); padding:16px; }
    .card { background:var(--card); border-radius:12px; padding:16px; max-width:560px; margin:0 auto 12px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    h2 { font-size:1.05rem; margin:16px 0 8px; }
    .muted { color:var(--muted); font-size:.92rem; }
    a.btn, button.btn {
      display:inline-block; margin:6px 6px 0 0; padding:12px 14px; border-radius:8px;
      background:var(--acc); color:#fff; text-decoration:none; border:0; font-weight:600; cursor:pointer;
    }
    a.btn.secondary, button.btn.secondary { background:#2a3548; }
    a.btn.big { display:block; text-align:center; margin:8px 0; }
    code, .mono { font-family: ui-monospace, monospace; word-break:break-all; font-size:.85rem; }
    ul { padding-left:1.2rem; }
    .err { color:#ff8a8a; }
    .ok { color:var(--ok); }
    .qr { display:block; margin:12px auto; background:#fff; padding:10px; border-radius:8px; max-width:220px; }
    .warn { background:#2a2410; border:1px solid #6a5a20; border-radius:8px; padding:10px 12px; margin:10px 0; font-size:.92rem; }
  </style>
</head>
<body>
  <div class="card" id="main">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <img src="/assets/pss-brand/logo/mark-48.png" alt="ПСС" width="40" height="40" style="border-radius:8px" />
      <h1 style="margin:0">Подключение к ПСС</h1>
    </div>
    <p class="muted">Откройте ссылку, которую прислал штаб. Здесь — логин, сертификат и настройки.</p>
    <p id="status" class="muted">Загрузка…</p>
  </div>
  <script>
    const PKG_PSS = 'ru.plasmadancer.psr.tak';
    const PKG_ATAK = 'com.atakmap.app.civ';
    const PKG_ICU = 'ru.plasmadancer.psr.icu';
    const params = new URLSearchParams(location.search);
    const t = params.get('t') || params.get('token') || '';
    const status = document.getElementById('status');
    const main = document.getElementById('main');

    /** Chrome/Android often ignore bare tak:// from HTTPS — use intent:// */
    function toIntent(takUrl, pkg) {
      try {
        const u = new URL(takUrl);
        const pathQuery = (u.hostname || '') + (u.pathname || '') + (u.search || '');
        const fallback = location.href;
        return 'intent://' + pathQuery +
          '#Intent;scheme=' + encodeURIComponent(u.protocol.replace(':','')) +
          ';package=' + pkg +
          ';S.browser_fallback_url=' + encodeURIComponent(fallback) +
          ';end';
      } catch (e) {
        return takUrl;
      }
    }

    function openDeepLink(takUrl, pkg) {
      const intent = toIntent(takUrl, pkg);
      // Prefer intent on Android; also try raw scheme as fallback
      const a = document.createElement('a');
      a.href = intent;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => {
        // Some WebViews ignore intent:// — try raw scheme
        try { location.href = takUrl; } catch (_) {}
      }, 800);
    }

    async function load() {
      if (!t) {
        status.innerHTML = '<span class="err">В ссылке нет токена. Попросите штаб прислать персональную ссылку.</span>';
        return;
      }
      try {
        const res = await fetch('/api/psr/invite?t=' + encodeURIComponent(t));
        const data = await res.json();
        if (!res.ok || !data.success) {
          status.innerHTML = '<span class="err">' + (data.error || 'Ссылка недействительна') + '</span>';
          return;
        }
        const d = data.downloads || {};
        const s = data.server || {};
        const cfg = data.config || {};
        const apps = data.apps || {};
        const tak = (cfg.links && cfg.links.tak_enroll) || data.qr_string || '';
        const icu = (cfg.links && cfg.links.icu_import) || data.qr_icu || '';
        const v = cfg.video || {};
        const ca = cfg.ca || {};
        const qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&ecc=M&data=' + encodeURIComponent(tak);
        const cfgText = [
          'host=' + (s.host || ''),
          'cot=' + (s.host || '') + ':' + (s.cot_ssl || 8089) + ':ssl',
          'enroll=' + (s.enrollment || 8446),
          'user=' + (data.username || ''),
          'rtsp=' + (v.publish_url || ''),
          'ca=' + (ca.truststore_url || '') + ' pass=' + (ca.password || 'atakatak'),
        ].join('\n');

        function appBtn(id, cls) {
          const a = apps[id];
          if (!a) return '';
          return '<a class="btn ' + (cls || '') + '" href="#" data-app="' + id + '">' + (a.label || id) + '</a>';
        }

        main.innerHTML =
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><img src="/assets/pss-brand/logo/mark-48.png" alt="ПСС" width="40" height="40" style="border-radius:8px"/><h1 style="margin:0">Подключение к ПСС</h1></div>' +
          '<p><strong>Логин / позывной:</strong> <span class="mono">' + data.username + '</span></p>' +
          '<p class="muted">' + (data.hint || '') + '</p>' +
          '<p><strong>Пароль корневого сертификата (P12):</strong> <span class="mono ok">' + (data.ca_password || 'atakatak') + '</span></p>' +

          '<h2>Универсальный конфиг</h2>' +
          '<p class="muted">Один набор параметров для любого клиента (ПСС TAK, ATAK CIV, OpenTAK ICU / ПСС Видео). Пароль учётки штаб сообщает отдельно.</p>' +
          '<pre class="mono" id="cfgBox" style="white-space:pre-wrap;background:#0b1016;padding:10px;border-radius:8px;">' +
            cfgText.replace(/</g,'') + '</pre>' +
          '<button type="button" class="btn secondary" id="btnCopyCfg">Скопировать конфиг</button>' +
          '<a class="btn secondary" href="' + (d.config_json || ('/api/psr/invite?t=' + encodeURIComponent(t) + '&format=config')) + '">JSON</a>' +
          '<a class="btn secondary" href="' + (d.connect_txt || '/downloads/psr-connect.txt') + '">psr-connect.txt</a>' +

          '<div class="warn">В Chrome / Telegram ссылка <code>tak://</code> часто не открывает приложение. Жмите кнопку приложения или QR камерой телефона.</div>' +

          '<h2>1. Установите клиент</h2>' +
          '<a class="btn" href="' + (d.pss_tak || '/downloads/PSS-TAK-latest.apk') + '">ПСС TAK</a>' +
          '<a class="btn secondary" href="' + (d.icu || '/downloads/OpenTAK_ICU-PSR-latest.apk') + '">ПСС Видео (опция)</a>' +
          '<a class="btn secondary" href="' + (d.field_kit || '/downloads/psr-field-kit.zip') + '">Комплект ATAK</a>' +

          '<h2>2. Открыть в приложении</h2>' +
          appBtn('pss_tak', 'big') +
          appBtn('atak_civ', 'big secondary') +
          appBtn('opentak_icu', 'big secondary') +
          appBtn('psr_icu', 'big secondary') +
          '<a class="btn big secondary" id="btnAtakCs" href="#">Позывной в ATAK (preference)</a>' +
          '<a class="btn big secondary" id="btnAtakZip" href="#">Импорт datapackage в ATAK</a>' +
          '<p class="muted">ПСС TAK после enrollment сам умеет трансляцию (Инструменты → Трансляция). Отдельное ICU нужно только для USB/экрана.</p>' +
          '<img class="qr" alt="QR enrollment" src="' + qrImg + '" width="220" height="220" />' +

          '<h2>3. Сертификат вручную</h2>' +
          '<a class="btn" href="' + (d.truststore || '/downloads/truststore-root.p12') + '">truststore-root.p12</a>' +
          '<a class="btn secondary" href="' + (d.atak_config || '/downloads/psr-atak-config.zip') + '">Настройки ATAK (zip)</a>' +
          '<p class="muted">Пароль P12: <strong>atakatak</strong></p>' +
          '<details class="muted"><summary>Технические ссылки</summary>' +
          '<p class="mono">TAK enroll: ' + tak.replace(/</g,'') + '</p>' +
          '<p class="mono">ICU import: ' + (icu || '').replace(/</g,'') + '</p></details>';

        document.querySelectorAll('[data-app]').forEach(function (el) {
          el.addEventListener('click', function (ev) {
            ev.preventDefault();
            const a = apps[el.getAttribute('data-app')];
            if (a && a.deeplink) openDeepLink(a.deeplink, a.package);
          });
        });
        var btnCopy = document.getElementById('btnCopyCfg');
        if (btnCopy) btnCopy.addEventListener('click', function () {
          navigator.clipboard.writeText(cfgText).catch(function () {});
        });
        var btnAtakCs = document.getElementById('btnAtakCs');
        if (btnAtakCs && data.qr_pref_callsign) {
          btnAtakCs.addEventListener('click', function (ev) {
            ev.preventDefault();
            openDeepLink(data.qr_pref_callsign, PKG_ATAK);
          });
        }
        var btnAtakZip = document.getElementById('btnAtakZip');
        if (btnAtakZip && cfg.links && cfg.links.tak_import_datapackage) {
          btnAtakZip.addEventListener('click', function (ev) {
            ev.preventDefault();
            openDeepLink(cfg.links.tak_import_datapackage, PKG_ATAK);
          });
        }
      } catch (e) {
        status.innerHTML = '<span class="err">Ошибка сети</span>';
      }
    }
    load();
  </script>
</body>
</html>
