<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сообщить о пропавшем — ПСС</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=pss1" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=pss1" />

  <style>
    :root { --bg:#0f1419; --card:#1c2430; --line:#334; --acc:#2a8; --txt:#eef2f6; --mut:#9aa; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; color:var(--txt);
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a3a40 0%, transparent 55%),
                  linear-gradient(160deg, #0f1419, #152028 60%, #101820);
    }
    .wrap { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
    h1 { font-size:1.6rem; margin:0 0 8px; letter-spacing:-.02em; }
    .lead { color:var(--mut); margin:0 0 22px; line-height:1.45; }
    form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
    label { display:block; font-size:13px; color:var(--mut); margin:12px 0 6px; }
    input, textarea, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#121820; color:var(--txt); }
    button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--acc); color:#04110c; font-weight:700; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    .ok, .err { margin-top:14px; padding:12px; border-radius:8px; }
    .ok { background:#143024; border:1px solid #2a8; }
    .err { background:#3a1818; border:1px solid #a44; }
    .hp { position:absolute; left:-9999px; opacity:0; height:0; width:0; }
    footer { margin-top:18px; font-size:12px; color:var(--mut); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/pss-brand/logo/horizontal-40.png" alt="ПСС" height="36" style="display:block" />
    <h1>ПСС — сообщить о пропавшем</h1>
    <p class="lead">Форма для граждан и свидетелей. Диспетчер штаба получит обращение в очередь.</p>
    <form id="f" novalidate>
      <label>ФИО пропавшего *</label>
      <input name="missing_name" required maxlength="200" autocomplete="name" />
      <label>Возраст (примерно)</label>
      <input name="missing_age" maxlength="32" />
      <label>Пол</label>
      <select name="missing_sex"><option value="">—</option><option>м</option><option>ж</option><option>не указан</option></select>
      <label>Где и когда видели последний раз</label>
      <input name="last_seen_place" maxlength="500" placeholder="Адрес / ориентир" />
      <input name="last_seen_at" type="datetime-local" />
      <label>Приметы, одежда, особенности</label>
      <textarea name="appearance" rows="4" maxlength="4000"></textarea>
      <label>Кратко, что случилось</label>
      <textarea name="summary" rows="3" maxlength="4000"></textarea>
      <label>Ваше имя</label>
      <input name="reporter_name" maxlength="200" />
      <label>Ваш телефон *</label>
      <input name="reporter_phone" required maxlength="40" inputmode="tel" placeholder="+7…" />
      <div class="hp" aria-hidden="true">
        <label>Website</label>
        <input name="website" tabindex="-1" autocomplete="off" />
      </div>
      <button type="submit" id="go">Отправить</button>
      <div id="msg"></div>
    </form>
    <footer>Экстренный случай — звоните 112. Эта форма не заменяет вызов спасателей.</footer>
  </div>
<script>
const f = document.getElementById('f');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
f.onsubmit = async (e) => {
  e.preventDefault();
  msg.innerHTML = '';
  const fd = new FormData(f);
  const body = Object.fromEntries(fd.entries());
  if (body.last_seen_at) body.last_seen_at = new Date(body.last_seen_at).toISOString();
  go.disabled = true;
  try {
    const r = await fetch('/api/crm/public/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || ('Ошибка '+r.status));
    msg.innerHTML = `<div class="ok">Принято. Номер обращения: <strong>${j.case_number}</strong>. Сохраните его — штаб может перезвонить.</div>`;
    f.reset();
  } catch (err) {
    msg.innerHTML = `<div class="err">${err.message}</div>`;
  } finally {
    go.disabled = false;
  }
};
</script>
</body>
</html>
